name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack project
        run: |
          unzip -q -o Minesweeper_android.zip -d src
          SPEC=$(find src -name buildozer.spec | head -n 1)
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Configure build (stable versions)
        run: |
          cd "$PROJECT_DIR"
          sed -i 's/^android.archs.*/android.archs = arm64-v8a/' buildozer.spec
          sed -i '/^\[app\]/a p4a.branch = v2024.01.21\nandroid.ndk = 25b' buildozer.spec
          grep -E '^(p4a.branch|android.ndk|android.archs|requirements)' buildozer.spec

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool libltdl-dev pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install buildozer==1.5.0 cython==0.29.36 setuptools

      - name: Build APK
        run: |
          set +o pipefail
          cd "$PROJECT_DIR"
          yes | buildozer android debug 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/apk"
          cp bin/*.apk "$GITHUB_WORKSPACE/apk/"

      - name: Show error
        if: failure()
        run: tail -n 120 build.log || true

      - uses: actions/upload-artifact@v4
        with:
          name: minesweeper-apk
          path: apk/*.apk
